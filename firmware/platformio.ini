; DeskDial firmware for the JC3636W518 (ESP32-S3, 360x360 round display).
;
;   pio run -e full -t upload       media + hardware pages (default)
;   pio run -e media -t upload      "now playing" only
;   pio run -e hardware -t upload   hardware stats only
;
; The board is an ESP32-S3 with octal PSRAM, flashed through its native USB
; port (USB Serial/JTAG).
; SPDX-License-Identifier: MIT

[platformio]
default_envs = full

[env]
; ESP32_Display_Panel 0.1.x needs Arduino core 3.x, which PlatformIO's own
; espressif32 platform doesn't ship: pioarduino's community platform does.
; 55.03.35 = Arduino core 3.3.5 (ESP-IDF 5.5).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi ; octal PSRAM (artwork, LVGL heap)
board_build.partitions = huge_app.csv     ; 3 MB app, no OTA
monitor_speed = 921600
lib_ldf_mode = deep+
lib_deps =
    https://github.com/lvgl/lvgl.git#v8.4.0
    ; The vendor driver (src/board) uses the 0.1.x API; 1.x renamed it.
    ; IO_Expander first: Display_Panel depends on it.
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v0.0.2
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v0.1.4
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1       ; Serial = the native USB port
    -DLV_CONF_INCLUDE_SIMPLE          ; lvgl finds include/lv_conf.h
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include

[env:full]
build_flags = ${env.build_flags}
    -DDESKDIAL_MEDIA=1
    -DDESKDIAL_HARDWARE=1

[env:media]
build_flags = ${env.build_flags}
    -DDESKDIAL_MEDIA=1
    -DDESKDIAL_HARDWARE=0
    -DFONT_NUM_34=0                   ; temperature digits: hardware page only

[env:hardware]
build_flags = ${env.build_flags}
    -DDESKDIAL_MEDIA=0
    -DDESKDIAL_HARDWARE=1
    -DFONT_ICONS_48=0                 ; play/pause/note icons: media page only
